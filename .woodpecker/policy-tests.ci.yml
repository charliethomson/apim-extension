# Generated by `kiln emit woodpecker`. Do not edit — regenerate.
#
# policy test runner: build · tests · end to end · the packed CLI over the fixtures
#
# The pipeline is defined in `.kiln/src/`; this file is a projection of
# `.kiln/lock.json` and every step below is one `kiln run`. Woodpecker is a
# dumb executor until kiln's own scheduler lands, at which point this file is
# deleted rather than maintained — design/03-pipeline-dsl.md §6.
#
# `.serialize(…)` says cancel — not expressible here: Woodpecker decides
# that per repository, in its settings, not per file.
#
# NEEDS THE REPOSITORY'S "TRUSTED" FLAG (volumes) in Woodpecker's settings.
# Steps below mount host paths — declared caches and/or the Docker socket —
# and Woodpecker refuses the whole workflow for an untrusted repository.
#
# `.kiln/`'S GIT DEPENDENCIES ARE FETCHED WITH `ssh_key`, the checkout key, so it
# must be able to read every private repository `.kiln/Cargo.toml` names. Only
# the `kiln-fetch` step holds it, as KILN_FETCH_KEY: it resolves those dependencies
# from outside the tree and compiles nothing, and every job step builds `.kiln/`
# offline without it.
#
# PUSH-ONLY: a repo with a checkout key runs nothing on pull requests, so this
# file has no pull_request event and `kiln check` refuses one. Woodpecker runs
# a pull request's own copy of this file, so nothing in it keeps a secret from
# one: leave pull_request off the event list of `ssh_key`, and of every other
# secret this repo holds, in Woodpecker's secret settings —
# design/08-secrets.md, "Pull requests: push-only".

when:
  - event: push
    branch: "main"
    path:
      include:
        - "runner/**"
        - "packages/testing/**"
        - "packages/fixtures/**"
        - "cli/**"
        - "scripts/ci/version.sh"
        - "packages/csharp-engine/assets/ApimContext.cs"
        - ".kiln/src/pipelines/policy_tests.rs"
        - ".kiln/src/pipelines/engine.rs"
        - ".kiln/src/**"
        - ".kiln/Cargo.toml"
        - ".kiln/Cargo.lock"
  - event: manual

labels:
  # Pin to the docker agents. Without this an unlabelled workflow can be
  # round-robined onto the local macOS/Windows agents, which treat `image:` as
  # a host executable and fail with `exec not found` — on the wrong machine,
  # for a reason the log does not give.
  platform: linux/amd64

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      # Full history and tags, not the plugin's partial clone: the checkout
      # contract guarantees both, because a version stamp counts commits.
      partial: false
      tags: true

steps:
  kiln-telemetry-begin:
    # Synthetic — this step is not a job. It writes the instant that
    # `kiln_job_duration_seconds` is measured from; the trailing step reads it back and
    # emits — design/10-telemetry-contract.md, and THM-416 for why the
    # measurement is here rather than in `kiln run`.
    #
    # First in the file, which is the earliest a step can run. On a container
    # agent Woodpecker has already run the clone plugin by then, so the window
    # excludes checkout there and includes it on a native agent — which is where
    # the hand-written baseline shim starts its clock too. Matching that matters
    # more than improving on it: a different window is a different quantity, and
    # the entire value of the baseline is that the two sides are comparable.
    #
    # `failure: ignore`, and the command cannot fail anyway. Telemetry must never
    # fail a release.
    image: "rust:1-bookworm"
    failure: ignore
    commands:
      - |
        # Not the workspace: on the docker backend /woodpecker is the per-workflow
        # volume every step shares, and a file in the checkout whose contents change
        # every run would bust the layer cache of any `COPY . .` build — and a native
        # checkout cannot clone into a directory that is not empty. A local-backend
        # agent runs every step on the host, so TMPDIR is shared there.
        _d=/woodpecker; [ -d "$_d" ] || _d="$${TMPDIR:-/tmp}"
        date +%s > "$_d/kiln-t0-$${CI_PIPELINE_NUMBER:-0}-policy-tests.ci" || true
  kiln-fetch:
    # Synthetic — this step is not a job. Resolves `.kiln/`'s dependencies with
    # `ssh_key` and compiles nothing; every job step below builds `.kiln/` offline
    # from what it leaves, without the key — design/08-secrets.md, "The checkout
    # key".
    # No `failure: ignore`: without `.kiln/`'s dependencies no job can start.
    image: "rust:1.99.1-bookworm@sha256:e12566d5abc17a0da741628782cdb504b68b8961f5bfcf677936bf3e8b32de29"
    environment:
      KILN_FETCH_KEY:
        from_secret: ssh_key
    commands:
      - |
        set -eu
        # Resolve `.kiln/`'s dependencies with the checkout key and compile nothing:
        # from an empty directory, so no rust-toolchain.toml or .cargo/config.toml on
        # this branch is read, and over ssh and https only. No job step holds the key.
        _kiln_src=$PWD
        _kiln_key=$(mktemp "$${TMPDIR:-/tmp}/kiln-fetch.XXXXXXXX")
        _kiln_cwd=$(mktemp -d "$${TMPDIR:-/tmp}/kiln-cwd.XXXXXXXX")
        trap 'rm -rf "$_kiln_key" "$_kiln_cwd"' EXIT
        printf '%s\n' "$(printf '%s' "$KILN_FETCH_KEY" | tr -d '\r')" > "$_kiln_key"
        unset KILN_FETCH_KEY
        cd "$_kiln_cwd"
        GIT_SSH_COMMAND="ssh -i '$_kiln_key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes" GIT_ALLOW_PROTOCOL=ssh:https CARGO_NET_GIT_FETCH_WITH_CLI=true cargo vendor --manifest-path "$_kiln_src/.kiln/Cargo.toml" /woodpecker/kiln-vendor > /woodpecker/kiln-vendor.toml
  dotnet:
    image: "rust:1-bookworm"
    volumes:
      - "/var/lib/woodpecker-cache/apim-extension/kiln/dotnet-sdk:/kiln-cache/dotnet-sdk"
      - "/var/lib/woodpecker-cache/apim-extension/kiln/node/npm-modules:/kiln-cache/node/npm-modules"
    environment:
      CI: "true"
      KILN_CACHE_DIR: "/kiln-cache"
    commands:
      - |
        # What `kiln run` hands the job body as ctx.run_info(), read from Woodpecker
        # here at run time. An empty KILN_EVENT under CI is `unknown`, never `manual`.
        KILN_EVENT="$${CI_PIPELINE_EVENT:-}"
        KILN_SHA="$${CI_COMMIT_SHA:-}"
        KILN_TAG="$${CI_COMMIT_TAG:-}"
        KILN_BRANCH="$${CI_COMMIT_BRANCH:-}"
        if [ "$KILN_EVENT" = pull_request ]; then KILN_BRANCH="$${CI_COMMIT_SOURCE_BRANCH:-}"; fi
        KILN_IS_MAIN=false
        case "$KILN_EVENT" in
          push | cron | manual)
            if [ -n "$KILN_BRANCH" ] && [ "$KILN_BRANCH" = "$${CI_REPO_DEFAULT_BRANCH:-}" ]; then KILN_IS_MAIN=true; fi ;;
        esac
        KILN_RUN_ID="$${CI_REPO_NAME:-}-$${CI_PIPELINE_NUMBER:-}-$${CI_WORKFLOW_NAME:-}-$${CI_STEP_NAME:-}"
        KILN_MESSAGE="$${CI_COMMIT_MESSAGE:-}"
        export KILN_EVENT KILN_SHA KILN_TAG KILN_BRANCH KILN_IS_MAIN KILN_RUN_ID KILN_MESSAGE
        # `.kiln/` from what the fetch step resolved: offline, and holding no key.
        cargo build --manifest-path .kiln/Cargo.toml --offline --config /woodpecker/kiln-vendor.toml || exit 1
        cargo run --manifest-path .kiln/Cargo.toml --offline --config /woodpecker/kiln-vendor.toml -- run policy-tests.ci dotnet
  kiln-telemetry-end:
    # Synthetic — this step is not a job. Emits one `kiln_job_duration_seconds`
    # observation and one `kiln.job` span for this workflow.
    #
    # `status: [success, failure]` so a failed workflow is recorded as
    # `outcome="failure"` rather than as a missing series — a baseline that
    # quietly skips its failures makes every pipeline look more reliable than it
    # is. `failure: ignore` and the unconditional `exit 0` below are the other two
    # layers of the same rule: a hung collector costs this job seconds and a dead
    # one costs it a log line.
    image: "rust:1-bookworm"
    failure: ignore
    when:
      - status: [success, failure]
    # No `depends_on`: this workflow runs its steps in order, and one
    # `depends_on` anywhere in a file switches Woodpecker to DAG execution.
    commands:
      - |
        # One `kiln_job_duration_seconds` observation and one `kiln.job` span for this workflow,
        # pushed over OTLP/HTTP. The metric name, the label names, the label VALUES
        # and the bucket boundaries below are not choices - they are transcribed from
        # design/10-telemetry-contract.md, and kiln's runtime implements the same
        # document from the other side. If this writes `cancelled` and the runtime
        # writes `canceled`, Prometheus holds two series that no query joins, and
        # nobody finds out until the graph is needed.
        #
        # NO `set -e`, deliberately. A telemetry outage must never fail a release, so
        # every path below exits 0 and every network call is time-capped; the
        # `failure: ignore` above is the second independent layer.
        #
        # It captures no step output (contract 8). This runs beside whatever secrets
        # the job declared, with no runtime enforcing scrubbing - timings and
        # identity only.
        set -u
        LC_ALL=C; export LC_ALL

        _log() { echo "kiln-telemetry: $*" >&2; }

        # contract 7.3: lowercase, [a-z0-9._-] only, and NEVER empty - in Prometheus
        # an absent label and an empty one are the same series, and both differ from
        # a populated one. Only values that are unknown until run time come through
        # here; the rest were sanitised when this file was generated.
        _label() {
          _v=$(printf '%s' "$${1:-}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-')
          _v=$(printf '%s' "$_v" | sed -e 's/^-*//' -e 's/-*$//')
          [ -n "$_v" ] || _v=unknown
          printf '%s' "$_v"
        }

        # $1 bytes of randomness as hex: 16 for a trace id, 8 for a span id. A span
        # with a weak id beats no span, so a host with no /dev/urandom still gets one.
        _hex() {
          _n=$(( $1 * 2 ))
          _h=$(od -An -tx1 -N"$1" /dev/urandom 2>/dev/null | tr -d ' \n')
          if [ "$${#_h}" -ne "$_n" ]; then
            _h=$(printf '%s%s' "$$$$" "$(date +%s)" | od -An -tx1 | tr -d ' \n')
            while [ "$${#_h}" -lt "$_n" ]; do _h="$_h$_h"; done
            _h=$(printf '%s' "$_h" | cut -c "1-$_n")
          fi
          printf '%s' "$_h"
        }

        # curl, then wget, then python3: a job declares its own image, those images
        # are minimal, and they differ from each other. Time-capped, which is the
        # whole difference between "telemetry is down" and "CI is down".
        _post() {
          if command -v curl >/dev/null 2>&1; then
            curl -fsS --connect-timeout 5 --max-time 15 -H 'Content-Type: application/json' --data-binary "@$2" "$1" >/dev/null 2>&1
          elif command -v wget >/dev/null 2>&1; then
            wget -q -O /dev/null -T 15 --header='Content-Type: application/json' --post-file="$2" "$1" >/dev/null 2>&1
          elif command -v python3 >/dev/null 2>&1; then
            python3 -c "import sys,urllib.request; b=open(sys.argv[2],'rb').read(); r=urllib.request.Request(sys.argv[1],data=b,headers={'Content-Type':'application/json'}); urllib.request.urlopen(r,timeout=15).read()" "$1" "$2" >/dev/null 2>&1
          else
            _log "no curl, wget or python3 in this image - cannot push"
            return 127
          fi
        }

        # One OTLP attribute. Every value reaching this is [a-z0-9._-] and needs no
        # JSON escaping.
        _attr() { printf '{"key":"%s","value":{"stringValue":"%s"}}' "$1" "$2"; }

        # contract 2. `dev.thmsn.kiln.shim` is the hand-written YAML baseline; this
        # workflow is a PORTED run, and service.name is the one axis separating the
        # two populations (contract 9).
        _service='dev.thmsn.kiln.agent'

        # contract 7.1, sanitised out of `.kiln/lock.json` when this file was
        # generated, so nothing at run time can fork the series. `repo` is the join
        # key: it is the slug given to `kiln::repo(...)`, and the baseline shim must
        # report the identical string or the before and the after are unrelated.
        _repo='apim-extension'
        _pipeline='policy-tests.ci'
        _job='dotnet'

        # contract 5, verbatim and in order. +Inf is implicit and is emitted as the
        # final bucket count. Do not add, remove or reorder a boundary.
        _buckets='10 20 30 60 120 180 300 420 600 900 1200 1500 1800 2400 2700 3000 3600 4500 5400 7200'
        _bounds='10,20,30,60,120,180,300,420,600,900,1200,1500,1800,2400,2700,3000,3600,4500,5400,7200'

        # Where the begin step left the start timestamp. Not the workspace: on the
        # docker backend /woodpecker is the per-workflow volume every step shares,
        # and a file in the checkout whose contents change every run would bust the
        # layer cache of any `COPY . .` build.
        _d=/woodpecker; [ -d "$_d" ] || _d="$${TMPDIR:-/tmp}"
        # A Windows agent runs this under Git Bash, whose /tmp is not the TEMP the
        # PowerShell begin step wrote to, so the shim names the directory outright.
        [ -z "$${KILN_T0_DIR:-}" ] || _d=$KILN_T0_DIR
        _t0f="$_d/kiln-t0-$${CI_PIPELINE_NUMBER:-0}-policy-tests.ci"
        [ -f "$_t0f" ] || { _log "no start marker at $_t0f - emitting nothing"; exit 0; }
        _t0=$(tr -cd '0-9' <"$_t0f" 2>/dev/null)
        rm -f "$_t0f" 2>/dev/null || true

        # CI_STEP_STARTED is the instant Woodpecker started THIS step, which is when
        # the previous one ended - a truer end of the job than `date` here, which
        # would also count this step's own start.
        _t1=$${CI_STEP_STARTED:-}
        case $_t1 in *[!0-9]*|'') _t1=$(date +%s) ;; esac
        case $_t0 in *[!0-9]*|'') _log "unusable start marker - emitting nothing"; exit 0 ;; esac
        # A negative duration is a broken clock or a stale marker, not a fast build.
        [ "$_t1" -ge "$_t0" ] || { _log "start is after end (t0=$_t0 t1=$_t1) - emitting nothing"; exit 0; }
        _dur=$(( _t1 - _t0 ))

        # contract 7.2, and the edge cases are the contract's rather than ours: a job
        # killed by its timeout is `failure`, a job that never started is `failure`,
        # `cancelled` has two l's, and an unreadable status reads as `failure`
        # because failure is the value that cannot flatter the success rate. A
        # workflow skipped by path filters runs no steps and so emits nothing at all,
        # which is what the contract asks for.
        _outcome=failure
        case $(_label "$${CI_PIPELINE_STATUS:-}") in
          success) _outcome=success ;;
          killed|cancelled|canceled) _outcome=cancelled ;;
        esac

        # contract 3.1: the agent's registered name, and the same string as
        # host.name. Inside a container `hostname` is the container id, a fresh value
        # every run - as a metric label that is not coarse, it is useless - so a
        # container step reports the contract's literal `unknown` until an agent
        # passes KILN_AGENT in.
        if [ -n "$${KILN_AGENT:-}" ]; then
          _agent=$(_label "$KILN_AGENT")
        elif [ -f /.dockerenv ] || [ -f /run/.containerenv ]; then
          _agent=unknown
        else
          _agent=$(_label "$(hostname 2>/dev/null || printf '')")
        fi
        _run=$(_label "$${CI_PIPELINE_NUMBER:-}")
        _rev=$(_label "$${CI_COMMIT_SHA:-}")

        # Bucket index = the number of boundaries strictly below the value, which is
        # both OTel's (lower, upper] convention and Prometheus's `le`: a job of
        # exactly 10s lands in le="10", not in le="20".
        _counts=''
        _placed=0
        for _b in $_buckets; do
          if [ "$_placed" -eq 0 ] && [ "$_dur" -le "$_b" ]; then
            _counts="$_counts,\"1\""; _placed=1
          else
            _counts="$_counts,\"0\""
          fi
        done
        if [ "$_placed" -eq 0 ]; then _counts="$_counts,\"1\""; else _counts="$_counts,\"0\""; fi
        _counts=$${_counts#,}

        # Silent loss is the failure mode that matters here, because a baseline
        # cannot be re-collected - so every run's log says exactly what was emitted
        # and whether it landed.
        _log "kiln_job_duration_seconds{repo=\"$_repo\",pipeline=\"$_pipeline\",job=\"$_job\",agent=\"$_agent\",outcome=\"$_outcome\"} = $${_dur}s"

        # OTLP_ENDPOINT is the name standards/docs/observability.md uses. Woodpecker
        # has no repository-level variable, so the fleet sets it once, server-wide, with
        # WOODPECKER_ENVIRONMENT; that also keeps the collector's address out of every
        # generated file. There is deliberately no default: `localhost:4318` pushed into
        # the step's own container and logged a failure nobody read, and any real
        # address is one fleet's, not kiln's. Unset is said loudly, on every run.
        _ep=$${OTLP_ENDPOINT:-}
        if [ -z "$_ep" ]; then
          _log "WARNING: OTLP_ENDPOINT is not set, nothing pushed (build unaffected)"
          exit 0
        fi
        _ep=$${_ep%/}
        _p="$${TMPDIR:-/tmp}/kiln-otlp.$$$$"

        # Delta temporality (aggregationTemporality 1): this shell observes one job
        # and then exits, and the collector converts to cumulative for Prometheus,
        # which is where that conversion belongs (contract 2). No `unit` field, on
        # purpose - the collector's Prometheus exporter appends a unit suffix, and
        # this name already ends in `_seconds`.
        {
          printf '{"resourceMetrics":[{"resource":{"attributes":['
          _attr service.name "$_service"
          printf ']},"scopeMetrics":[{"scope":{"name":"kiln.emit"},"metrics":[{'
          printf '"name":"kiln_job_duration_seconds",'
          printf '"histogram":{"aggregationTemporality":1,"dataPoints":[{'
          printf '"startTimeUnixNano":"%s","timeUnixNano":"%s",' "$${_t0}000000000" "$${_t1}000000000"
          printf '"count":"1","sum":%s,' "$_dur"
          printf '"bucketCounts":[%s],"explicitBounds":[%s],' "$_counts" "$_bounds"
          printf '"attributes":['
          _attr repo "$_repo"; printf ,
          _attr pipeline "$_pipeline"; printf ,
          _attr job "$_job"; printf ,
          _attr agent "$_agent"; printf ,
          _attr outcome "$_outcome"
          printf ']}]}}]}]}]}\n'
        } > "$_p" 2>/dev/null
        if _post "$_ep/v1/metrics" "$_p"; then _log "metric -> $_ep/v1/metrics ok"; else _log "metric -> $_ep/v1/metrics FAILED (build unaffected)"; fi

        # contract 3: two span names and only two. The name is the KIND and the
        # identity lives in the attributes, or every pipeline becomes its own
        # operation in Tempo's service graph. The metric carries five labels and the
        # span eight attributes: kiln.run and vcs.revision are per-run identity,
        # which is what a trace is for and what a metric must never carry
        # (contract 7.3). Sampling is 1.0 and is not read from the environment
        # (contract 2). OTel status codes: 1 = Ok, 2 = Error.
        if [ "$_outcome" = success ]; then _status=1; else _status=2; fi
        {
          printf '{"resourceSpans":[{"resource":{"attributes":['
          _attr service.name "$_service"
          printf ']},"scopeSpans":[{"scope":{"name":"kiln.emit"},"spans":[{'
          printf '"traceId":"%s","spanId":"%s",' "$(_hex 16)" "$(_hex 8)"
          printf '"name":"kiln.job","kind":1,"flags":1,'
          printf '"startTimeUnixNano":"%s","endTimeUnixNano":"%s",' "$${_t0}000000000" "$${_t1}000000000"
          printf '"attributes":['
          _attr kiln.repo "$_repo"; printf ,
          _attr kiln.pipeline "$_pipeline"; printf ,
          _attr kiln.job "$_job"; printf ,
          _attr kiln.agent "$_agent"; printf ,
          _attr host.name "$_agent"; printf ,
          _attr kiln.outcome "$_outcome"; printf ,
          _attr kiln.run "$_run"; printf ,
          _attr vcs.revision "$_rev"
          printf '],"status":{"code":%s}}]}]}]}\n' "$_status"
        } > "$_p" 2>/dev/null
        if _post "$_ep/v1/traces" "$_p"; then _log "span   -> $_ep/v1/traces ok"; else _log "span   -> $_ep/v1/traces FAILED (build unaffected)"; fi

        rm -f "$_p" 2>/dev/null || true
        # Nothing this fragment can discover is worth failing a release.
        exit 0
